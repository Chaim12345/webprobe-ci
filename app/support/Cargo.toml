[package]
name = "webprobe-support"
version = "0.1.0"
edition = "2021"

# Stage A (#37): acyclic leaf modules extracted from webprobe-core so the
# core crate is smaller and these compile in parallel. No dependency on
# webprobe-core; anything engine-facing stays in core.
[dependencies]
base64 = "0.22"
flate2 = "1"
memmap2 = "0.9"
rand = "0.8"
rcgen = { version = "0.13", features = ["x509-parser"] }
regex = "1"
ring = "0.17"
rsa = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Decoder Hash menu parity (Burp 2026.11.2, 82 entries).
blake2 = "0.10"
blake3 = "1"
gost94 = "0.10"
kupyna = "0.1"
md2 = "0.10"
md4 = "0.10"
md-5 = "0.10"
ripemd = "0.1"
sha1 = "0.10"
sha3 = "0.10"
skein-hash = "0.3"
sm3 = "0.4"
streebog = "0.10"
tiger = "0.2"
tiny-keccak = { version = "2", features = ["keccak", "cshake", "tuple_hash", "parallel_hash", "sp800"] }
whirlpool = "0.10"
keccak = "0.1"
time = "0.3"
webpki-roots = "0.26"
x509-parser = { version = "0.16", features = ["verify"] }
